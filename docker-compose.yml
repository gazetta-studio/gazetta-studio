services:
  # Ports are bound to ephemeral host ports (no "<host>:<container>"
  # mapping) so running this compose alongside another local Azurite /
  # MinIO — or repeated test runs that leave containers around — doesn't
  # hit "port already in use". Tests discover the actual host port via
  # `DockerComposeEnvironment.getContainer(...).getMappedPort(...)`.
  azurite:
    # Pinned for reproducible CI pulls (verified latest stable on mcr,
    # 2026-09). minio below stays unpinned because the Docker Hub tag
    # API is not reachable from every build environment to verify a
    # specific RELEASE.* datestamp; the CI pre-pull-with-retry step
    # (.github/workflows/ci.yml `admin` job) is what protects both
    # images from transient registry denials — see #481.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000"
      - "10001"
      - "10002"

  minio:
    # `minio/minio` is gated behind auth on BOTH Docker Hub AND quay.io
    # (both return `unauthorized` to anonymous pulls — verified on the CI
    # runner and against each registry's anonymous-token endpoint). The
    # original #481 fix (Docker Hub → quay) and its hotfix-pin (#794) both
    # rotted when MinIO tightened anonymous access across their namespaces.
    #
    # `bitnamilegacy/minio` is Bitnami's published MinIO image, verified
    # anonymously pullable (200 via Docker Hub's anonymous token endpoint,
    # probe validated against the public library/alpine control). Bitnami
    # moved their community images to the `bitnamilegacy` namespace in 2025.
    # It is real MinIO, so the S3 StorageProvider conformance battery
    # exercises production-identical behavior. UNPINNED (`:latest`) — a
    # throwaway test container needs *a* working MinIO, not a frozen
    # version, and a pinned tag is the time-bomb that caused #794's rot.
    #
    # Bitnami conventions differ from `minio/minio`: the entrypoint runs
    # the server itself (no explicit `server /data` command), the console
    # is on 9001, and it reads the same MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    # credentials. The test discovers the host port via getMappedPort(9000),
    # so the unmapped `ports` entries are unchanged.
    image: bitnamilegacy/minio:latest
    ports:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
