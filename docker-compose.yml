services:
  # Ports are bound to ephemeral host ports (no "<host>:<container>"
  # mapping) so running this compose alongside another local Azurite /
  # MinIO — or repeated test runs that leave containers around — doesn't
  # hit "port already in use". Tests discover the actual host port via
  # `DockerComposeEnvironment.getContainer(...).getMappedPort(...)`.
  azurite:
    # Pinned for reproducible CI pulls (verified latest stable on mcr,
    # 2026-09). minio below stays unpinned because the Docker Hub tag
    # API is not reachable from every build environment to verify a
    # specific RELEASE.* datestamp; the CI pre-pull-with-retry step
    # (.github/workflows/ci.yml `admin` job) is what protects both
    # images from transient registry denials — see #481.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000"
      - "10001"
      - "10002"

  minio:
    # Pulled from quay.io (MinIO's own registry), NOT Docker Hub: Docker
    # Hub gates anonymous pulls of `minio/minio` (`pull access denied ...
    # may require docker login`) — the original #481 flake.
    #
    # UNPINNED (`:latest`) deliberately. A pinned `RELEASE.*.hotfix.*` tag
    # (#794) returned `unauthorized` on the runner two weeks later (#811
    # fix-forward): MinIO prunes `.hotfix.*` RELEASE tags, so the digest
    # the pin referenced stopped being served. `:latest` can't rot that
    # way. Reproducibility across runs is not worth a time-bomb for a
    # throwaway test container — testcontainers just needs *a* working
    # MinIO. If a future stable (non-hotfix) RELEASE tag proves durable
    # and reproducibility becomes worth pinning, revisit then.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
