# gz's client, generated from the admin API's OpenAPI document
# (design-agent-access.md Q8). nullable-type keeps null apart from absent,
# so a field such as alt can be cleared.
package: api
generate:
  client: true
  models: true
output-options:
  nullable-type: true
  # float32 can't hold a Unix time or a large file size exactly.
  type-mapping:
    number:
      default:
        type: float64
