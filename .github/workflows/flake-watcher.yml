name: Flake watcher

# Daily scan for CI flakes. A "flake" is a workflow run with run_attempt >= 2 —
# meaning an earlier attempt failed on the same SHA and someone hit "Re-run".
# Same code, different outcome = unambiguous flake signal.
#
# When found, hands the failed run to claude -p with the prompt at
# bots/flake-watcher/prompt.md. The agent reads logs, searches existing
# open issues, and either comments (with run-ID dedup) or files a new one
# per the convention established in #268.
#
# This workflow's failure doesn't block anything (continue-on-error) — it's
# monitoring infrastructure, not a gate.
on:
  schedule:
    # 12:00 UTC daily. After most overnight CI runs have completed; before
    # most contributors start their day so issues are filed by the time
    # anyone looks.
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Manual trigger — useful for testing prompt changes or backfilling
    # after the workflow itself was broken.
    inputs:
      lookback_hours:
        description: 'How many hours to scan back'
        required: false
        default: '48'

jobs:
  watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      # Read CI run history + read/write issues. No code/contents access needed.
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run flake watcher
        env:
          # Auth via Claude Code OAuth token — bills against the Claude account's
          # subscription rather than per-token API spend. Tied to your account;
          # rotate via `claude /logout` + new `claude /login` if compromised.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
        run: npm run flake-watcher -w @gazetta/bots

      # Per-investigation JSONL transcripts. A future agent can `gh run download
      # <run-id> -n flake-watcher-transcripts` to read every tool call and
      # decision from past runs — feeds the prompt-improvement loop documented
      # in bots/README.md.
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-watcher-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
