name: CI

on:
  push:
    branches: [main]
  # No base-branch filter — CI runs on every PR, including stacked ones
  # whose base is another feature branch. Without this, stacked PRs show
  # zero checks until they're retargeted to main.
  #
  # `ready_for_review` is added explicitly: GitHub's default pull_request
  # types are [opened, synchronize, reopened] — flipping a draft to
  # ready does NOT trigger CI without this. fix-bot opens PRs as drafts;
  # this ensures CI fires when they're flipped.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel older runs on PR branches only. On main, let every commit's
  # run finish — cancelling mid-flight could leave a push unvalidated
  # and races with deploy/publish workflows that trust CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # biome format --check on every file. Fails with diff output if any
      # file would be reformatted; run `npm run format` locally to fix.
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - run: npm test -w packages/gazetta

  admin:
    # Vue Test Utils + jsdom tests for apps/admin. The trophy/honeycomb
    # tier per testing-plan.md and the load-bearing gate for Vue
    # component + admin-API behavior. Requires the gazetta package to
    # be built first because tests/sw-build.test.ts invokes the admin
    # Vite build, which imports `gazetta/types` etc. via the package's
    # exports map (resolved against packages/gazetta/dist).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      # Pre-pull the testcontainers images BEFORE the tests run.
      # tests/docker.test.ts brings up MinIO + Azurite via testcontainers,
      # whose default pull policy is pull-if-absent — so once these images
      # are local, `.up()` performs no pull at test time.
      #
      # The #481 root cause was NOT a transient: Docker Hub now gates
      # anonymous pulls of `minio/minio` (deterministic `pull access denied`,
      # failed all retries identically). The fix is pulling MinIO from
      # quay.io (MinIO's own registry, no anonymous gating) — see
      # docker-compose.yml. The retry loop here is defense against GENUINE
      # transient network blips on either image, not the #481 fix.
      #
      # Image refs MUST match docker-compose.yml verbatim so the pulled
      # images satisfy testcontainers' pull-if-absent check.
      - name: Pre-pull testcontainers images (retry)
        run: |
          for image in mcr.microsoft.com/azure-storage/azurite:3.37.0 quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::failed to pull $image after 3 attempts"
                exit 1
              fi
              echo "pull of $image failed (attempt $attempt/3); retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
          done
      - run: npm test -w @gazetta/admin

  bots:
    # Pure-logic tests for the bots workspace (Stryker report parser,
    # fix-bot's failure-diagnostic + issue-shape helpers). Fast (~150ms)
    # and infrastructure-free — no testcontainers, no Playwright, no
    # workspace build needed. Gates only the bots/ tree, but runs on
    # every PR because changes to `bots/_lib/*` affect every bot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @gazetta/bots

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta

      # Cache Playwright browsers keyed by lockfile — version bumps
      # invalidate automatically. `--with-deps` still runs (system libs)
      # but browser download is skipped on cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=dev --shard=${{ matrix.shard }}/7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Pack once on linux — tarball is platform-independent.
  pack:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gazetta
      - run: npm run build:admin -w packages/gazetta
      - id: pack
        working-directory: packages/gazetta
        run: |
          tarball=$(npm pack --silent | tail -1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: gazetta-tarball
          path: packages/gazetta/${{ steps.pack.outputs.tarball }}
          retention-days: 1

  # Consume the packed tarball on each OS. The pack/install/dev path is what
  # end users experience — this is where platform-specific issues surface.
  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        # Windows smoke runs on main-only. PRs get Ubuntu + macOS for faster
        # feedback; Windows catches path/shell regressions post-merge, before
        # any tag is cut. Branch protection + linear history keeps the chain
        # honest — a tag always points at a SHA that cleared all three.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: gazetta-tarball
          path: packages/gazetta/
      - name: Smoke test (init → dev → curl)
        shell: bash
        run: |
          # Find the downloaded tarball
          TARBALL="$(ls packages/gazetta/gazetta-*.tgz | head -1)"
          GAZETTA_TARBALL="$(pwd)/$TARBALL" npm run smoke
