name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # No npm cache: a release build must not restore a cache that
          # other workflows can write (zizmor cache-poisoning). setup-node
          # caches automatically unless this is false.
          package-manager-cache: false

      - run: npm ci

      - run: npm run build -w packages/gazetta

      - run: npm run build:admin -w packages/gazetta

      # CI already ran tests + smoke on the PR whose squash/rebase produced
      # this tag commit — branch protection requires linear history, so the
      # tagged SHA is the validated SHA. Publish proceeds directly.

      # A release candidate (v0.9.0-rc.1) goes to the `rc` dist-tag, so
      # `npx gazetta@rc init` installs it and `latest` stays on the last
      # release (design-tutorial.md Q17). npm 10 would otherwise publish a
      # prerelease as `latest`. Any other prerelease suffix is refused.
      - name: Choose the npm dist-tag
        id: dist-tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            v*-rc.*) tag=rc ;;
            v*-*) echo "Unsupported prerelease tag: $REF_NAME"; exit 1 ;;
            *) tag=latest ;;
          esac
          echo "Publishing $REF_NAME to the $tag dist-tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm publish -w packages/gazetta --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
