name: Bots monthly compaction

# Monthly memory compaction for all memoryful bots. One workflow,
# one job per bot — each runs the bot's `:compact` script which reads
# the bot's skip-list and consolidates it (per-bot semantics differ).
#
# Replaces the prior dead-code-watcher-compact.yml; consolidated here
# so all compactors share one cron + one workflow_dispatch surface.
#
# Per-bot semantics:
#   - dead-code-watcher:compact — find ≥3 skip-list entries sharing
#     a pattern, replace with a glob rule.
#   - fix-bot:compact — rewrite lessons-learned.md from cross-issue
#     patterns in the skip-list (no glob rules; per-issue entries
#     stay durable).
#   - review-bot:compact — rewrite lessons-learned.md from cross-
#     candidate patterns in the skip-list + reviewer-log (no glob
#     rules; per-candidate entries stay durable).
on:
  schedule:
    # First Saturday of the month at 03:00 UTC = 05:00 CEST.
    # Cron syntax `* * 1-7 * 6` means "Saturdays where day-of-month
    # is 1-7" — i.e., the first Saturday. Stays 30 min after the
    # weekly dead-code-watcher fires (02:30 UTC) so they don't
    # collide on the same morning.
    - cron: '0 3 1-7 * 6'
  workflow_dispatch:
    # Manual trigger for testing or one-off compaction.
    inputs:
      target:
        description: 'Which compactor to run'
        type: choice
        options: [all, dead-code-watcher, fix-bot, review-bot]
        default: all

jobs:
  dead-code-watcher:
    # Run on cron OR when dispatch input is 'all' / 'dead-code-watcher'.
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'dead-code-watcher'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Share concurrency group with the daily dead-code-watcher workflow.
    # The compactor reads AND truncates the reviewer-log (prunes to a
    # bounded window after producing the lessons rewrite); racing with
    # the daily bot would lose verdicts. Queue instead of cancel.
    concurrency:
      group: dead-code-watcher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'dead-code-watcher'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore reviewer-log from the same cache the daily bot writes
      # to. The compactor reads recent entries, produces a lessons
      # rewrite, then PRUNES the file to a bounded window —
      # actions/cache@v6 saves the truncated file on post-step,
      # keeping the cache size bounded across months.
      - name: Restore reviewer-log cache
        uses: actions/cache@v6
        with:
          path: bots/dead-code-watcher/reviewer-log.jsonl
          key: dead-code-watcher-reviewer-log-v1

      - name: Run dead-code-watcher:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run dead-code-watcher:compact -w @gazetta/bots

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dead-code-watcher-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90

  fix-bot:
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'fix-bot'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Share concurrency group with the daily fix-bot workflow. The
    # compactor reads AND truncates the reviewer-log; racing with
    # the daily bot would lose verdicts. Queue instead of cancel.
    concurrency:
      group: fix-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'fix-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore reviewer-log from the same cache the daily fix-bot
      # writes to. The compactor reads recent entries, produces a
      # lessons-learned rewrite, then PRUNES the file to a bounded
      # window — actions/cache@v6 saves the truncated file on
      # post-step, keeping the cache size bounded across months.
      - name: Restore reviewer-log cache
        uses: actions/cache@v6
        with:
          path: bots/fix-bot/reviewer-log.jsonl
          key: fix-bot-reviewer-log-v1

      - name: Run fix-bot:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run fix-bot:compact -w @gazetta/bots

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fix-bot-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90

  review-bot:
    if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'review-bot'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Share concurrency group with the daily review-bot workflow. The
    # compactor reads AND truncates the reviewer-log; racing with the
    # daily bot would lose verdicts. Queue instead of cancel.
    concurrency:
      group: review-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name 'review-bot'
          git config user.email 'noreply@anthropic.com'

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Restore reviewer-log from the same cache the daily review-bot
      # writes to. The compactor reads recent entries, produces a
      # lessons-learned rewrite, then PRUNES the file to a bounded
      # window — actions/cache@v6 saves the truncated file on
      # post-step, keeping the cache size bounded across months.
      - name: Restore reviewer-log cache
        uses: actions/cache@v6
        with:
          path: bots/review-bot/reviewer-log.jsonl
          key: review-bot-reviewer-log-v1

      - name: Run review-bot:compact
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run review-bot:compact -w @gazetta/bots

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-bot-compact-transcripts
          path: bots/transcripts/
          if-no-files-found: ignore
          retention-days: 90
